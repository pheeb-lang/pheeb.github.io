<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3ec">
  <meta name="description" content="代表專案：班級管理系統與教室管理系統。">
  <title>代表專案｜我的作品集</title>
  <style>
    :root { color-scheme: light; --paper: #f7f3ec; --ink: #293850; --muted: #5d6a79; --accent: #995a46; --line: #d7cec3; --serif: "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PMingLiU", serif; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: "Microsoft JhengHei", system-ui, sans-serif; line-height: 1.8; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 8px; }
    .container { width: 84%; max-width: 1480px; margin-inline: auto; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 32px; min-height: 100px; }
    .site-name { font-family: var(--serif); font-size: 25px; font-weight: 600; text-decoration: none; white-space: nowrap; }
    .site-nav { display: flex; align-items: center; justify-content: flex-end; gap: 40px; }
    .site-nav a { padding-block: 8px; border-bottom: 1px solid transparent; font-size: 18px; letter-spacing: .1em; text-decoration: none; white-space: nowrap; }
    .site-nav a:hover, .site-nav a[aria-current="page"] { border-bottom-color: var(--accent); color: var(--accent); }
    .intro { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: center; gap: clamp(40px, 7vw, 128px); padding-block: 68px 80px; }
    .eyebrow { margin: 0; color: var(--accent); font-size: 14px; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 24px 0; font-family: var(--serif); font-size: clamp(44px, 5.35vw, 80px); font-weight: 500; line-height: 1.3; }
    .intro-description { margin: 0; color: var(--muted); font-size: 18px; }
    .project-directory { padding-top: 38px; }
    .project-directory ol { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
    .project-directory li { border-bottom: 1px solid var(--line); }
    .project-directory a { display: grid; grid-template-columns: 56px minmax(0, 1fr) 24px; align-items: center; gap: 20px; min-height: 76px; padding: 16px 20px 16px 0; text-decoration: none; font-size: 20px; transition: color .2s, background-color .2s; }
    .directory-number { font-family: Georgia, "Times New Roman", serif; font-size: 24px; font-weight: 700; }
    .directory-arrow { color: var(--muted); font-size: 18px; text-align: right; }
    .project-directory a:hover { color: var(--accent); background-color: rgba(153, 90, 70, .04); }
    .project-directory a:hover .directory-arrow { color: var(--accent); }
    .projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 56px; padding-bottom: 96px; }
    article { padding-top: 24px; border-top: 1px solid var(--line); scroll-margin-top: 32px; }
    .project-number { color: var(--accent); font-family: Georgia, serif; font-size: 18px; letter-spacing: .05em; }
    h2 { margin: 32px 0 18px; font-family: var(--serif); font-size: clamp(26px, 2.6vw, 38px); font-weight: 500; line-height: 1.5; }
    article p { margin: 0; color: var(--muted); font-size: 17px; }
    .project-link { display: block; text-decoration: none; }
    .project-link h2 { transition: color .2s; }
    .project-link:hover h2 { color: var(--accent); }
    .project-cta { display: inline-block; margin-top: 26px; padding-bottom: 4px; border-bottom: 1px solid var(--accent); color: var(--accent); font-size: 15px; }
    footer { display: flex; justify-content: space-between; gap: 24px; padding-block: 26px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; letter-spacing: .08em; }
    footer a { text-decoration: none; }
    footer a:hover { color: var(--accent); }
    @media (max-width: 720px) {
      .container { width: auto; margin-inline: 24px; }
      .header-inner { flex-wrap: wrap; gap: 12px; padding-block: 20px; min-height: auto; }
      .site-name { font-size: 22px; }
      .site-nav { width: 100%; justify-content: flex-end; gap: 24px; }
      .site-nav a { font-size: 14px; letter-spacing: .05em; }
      .intro { grid-template-columns: 1fr; gap: 32px; padding-block: 40px 48px; }
      .intro-description { font-size: 16px; }
      .project-directory { padding-top: 0; }
      .project-directory a { grid-template-columns: 40px minmax(0, 1fr) 20px; gap: 16px; min-height: 68px; padding-right: 8px; font-size: 18px; }
      .directory-number { font-size: 22px; }
      .projects { grid-template-columns: 1fr; gap: 40px; padding-bottom: 56px; }
      h2 { margin-top: 20px; }
      article p { font-size: 16px; }
      footer { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .project-directory a { transition: none; } }
  </style>
</head>

        <h1 id="page-title">代表專案</h1>

      </div>
      <nav class="project-directory" aria-label="專案目錄">
        <ol>
          <li><a href="class-management.html"><span class="directory-number">01</span><span>班級管理系統</span><span class="directory-arrow" aria-hidden="true">↗</span></a></li>
          <li><a href="classroom-management.html"><span class="directory-number">02</span><span>教室管理系統</span><span class="directory-arrow" aria-hidden="true">↗</span></a></li>

        <span class="project-cta">查看專案 <span aria-hidden="true">↗</span></span>
        </a>
      </article>
    </section>
  </main>
  <footer class="container"><span>我的作品集 · 持續探索，持續累積。</span><a href="index.html">返回首頁 ↗</a></footer>
</body>
</html>
